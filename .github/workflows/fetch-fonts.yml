name: Fetch fonts (temporary)
on:
  push:
    branches: [redesign]
    paths: [.github/workflows/fetch-fonts.yml]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p fonts
          curl -sS -A "$UA" "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" > /tmp/a.css
          cat /tmp/a.css | head -40
          # The latin subset is the last block.
          url=$(awk '/\/\* latin \*\//{f=1} f&&/src:/{print; exit}' /tmp/a.css | grep -oE 'https://[^)]+\.woff2')
          echo "latin: $url"
          curl -sS -o fonts/archivo.woff2 "$url"
          ls -la fonts
          git config user.name "fonts"; git config user.email "fonts@users.noreply.github.com"
          git add fonts && git commit -qm "Archivo (variable, latin) for the site" && git push
